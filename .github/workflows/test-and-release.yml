name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - 'main'
            - 'dev'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Repochecker (E/W3009) matches this block literally against ioBroker.example — group must be exactly github.ref.
# Cancel superseded runs for the same ref (rapid pushes abort in-flight workflows on that branch/PR).
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v1
              with:
                  node-version: '24.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        needs: check-and-lint
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'

    # Deploys the package to npm when a version tag is pushed (requires npm trusted publishing — see npm docs).
    # Skips publish when this semver already exists on npm (green run after workstation `npm publish`, then tag).
    deploy:
        needs: [check-and-lint, adapter-tests]

        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: write

        steps:
            - name: Skip deploy if this version is already on npm
              id: gate
              shell: bash
              run: |
                  VER="${GITHUB_REF#refs/tags/v}"
                  PKG="iobroker.autodoc"
                  set +e
                  GOT=$(npm view "${PKG}@${VER}" version 2>/dev/null | head -n1 | tr -d '\n\r ')
                  RV=$?
                  set -e
                  if [[ "$RV" -eq 0 && "$GOT" == "$VER" ]]; then
                    echo "::notice title=Deploy skipped::${PKG}@${VER} is already on npm — skipping ioBroker/testing-action-deploy. Create a GitHub Release for this tag manually if needed."
                    echo "deploy=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "deploy=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish to npm and create GitHub Release
              if: steps.gate.outputs.deploy == 'true'
              uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  github-token: ${{ secrets.GITHUB_TOKEN }}

# Optional: Sentry release notes — enable when you use Sentry and add SENTRY_AUTH_TOKEN as a repo secret
#          sentry: true
#          sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
#          sentry-project: "iobroker-autodoc"
#          sentry-version-prefix: "iobroker.autodoc"
#          sentry-github-integration: true
